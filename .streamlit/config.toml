# NeuroBridge identity (shared with the website in site/): midnight ground, ivory ink, semantic accents.
[theme]
base = "dark"
primaryColor = "#43c9b4"
backgroundColor = "#04060c"
secondaryBackgroundColor = "#0d1322"
textColor = "#ece7dc"
linkColor = "#8fd3ee"
linkUnderline = false
borderColor = "#1d2434"
dataframeBorderColor = "#161c2a"
dataframeHeaderBackgroundColor = "#080c17"
dataframeHeaderTextColor = "#bcb8ae"
codeBackgroundColor = "#080c17"
codeTextColor = "#8fd3ee"
font = "Hanken Grotesk, sans-serif"
headingFont = "Newsreader, serif"
codeFont = "Geist Mono, monospace"
headingFontWeights = [300, 300, 400, 600, 600, 600]
baseFontSize = 15
baseRadius = "small"
buttonRadius = "small"
showSidebarBorder = true
greenColor = "#43c9b4"
violetColor = "#9d8cf2"
blueColor = "#8fd3ee"
orangeColor = "#e6a35c"
redColor = "#e07a8f"
grayColor = "#868791"
chartCategoricalColors = ["#43c9b4", "#9d8cf2", "#8fd3ee", "#e6a35c", "#e07a8f", "#5c84e0", "#a3c46a", "#ece7dc"]
chartSequentialColors = ["#0f1a26", "#112730", "#13353a", "#164446", "#1a5553", "#1e6762", "#257a72", "#2d8e83", "#37a796", "#43c9b4"]

# Self-hosted fonts (SIL OFL, see app/static/fonts/OFL-*.txt): same files as site/fonts, latin + latin-ext subsets.
[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/geist-mono-normal-latin-ext.woff2"
weight = "400"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF"

